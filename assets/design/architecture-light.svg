<text x="464" y="260" font-family="Geist" font-size="11" font-weight="400" fill="#6E665A" text-anchor="start">find_skill · load_skill</text>
<rect x="282" y="278" width="164" height="64" rx="6" fill="#F4F0E8" stroke="#DDD6C9" stroke-width="1"/>
