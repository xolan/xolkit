<text x="292" y="316" font-family="Geist" font-size="11" font-weight="400" fill="#6E665A" text-anchor="start">applies the active profile</text>
<text x="292" y="332" font-family="Geist" font-size="11" font-weight="400" fill="#6E665A" text-anchor="start">tells sessions what changed</text>
<rect x="454" y="278" width="164" height="64" rx="6" fill="#F4F0E8" stroke="#DDD6C9" stroke-width="1"/>
<text x="464" y="299" font-family="Geist" font-size="12.5" font-weight="600" fill="#211D17" text-anchor="start">MCP gateway</text>
<text x="464" y="316" font-family="Geist" font-size="11" font-weight="400" fill="#6E665A" text-anchor="start">passes on server tools</text>
<text x="464" y="332" font-family="Geist" font-size="11" font-weight="400" fill="#6E665A" text-anchor="start">named server__tool</text>
<rect x="282" y="350" width="164" height="64" rx="6" fill="#F4F0E8" stroke="#DDD6C9" stroke-width="1"/>
<text x="292" y="371" font-family="Geist" font-size="12.5" font-weight="600" fill="#211D17" text-anchor="start">Process supervisor</text>
<text x="292" y="388" font-family="Geist" font-size="11" font-weight="400" fill="#6E665A" text-anchor="start">shims and child servers</text>
<text x="292" y="404" font-family="Geist" font-size="11" font-weight="400" fill="#6E665A" text-anchor="start">health, restart, stop</text>
<rect x="454" y="350" width="164" height="64" rx="6" fill="#F4F0E8" stroke="#DDD6C9" stroke-width="1"/>
<text x="464" y="371" font-family="Geist" font-size="12.5" font-weight="600" fill="#211D17" text-anchor="start">Event log</text>
<text x="464" y="388" font-family="Geist" font-size="11" font-weight="400" fill="#6E665A" text-anchor="start">calls, errors, timings</text>
<text x="464" y="404" font-family="Geist" font-size="11" font-weight="400" fill="#6E665A" text-anchor="start">feeds Connections</text>
<rect x="282" y="422" width="336" height="72" rx="6" fill="#F4F0E8" stroke="#B84A2E" stroke-width="1"/>
<text x="292" y="443" font-family="Geist" font-size="12.5" font-weight="600" fill="#211D17" text-anchor="start">Native plugin bridge</text>
<text x="292" y="461" font-family="Geist" font-size="11" font-weight="400" fill="#6E665A" text-anchor="start">runs claude / codex plugin install, enable, disable</text>
<text x="292" y="477" font-family="Geist" font-size="11" font-weight="400" fill="#6E665A" text-anchor="start">for plugins with hooks, subagents, styles or a status line</text>
