<rect x="268" y="152" width="364" height="356" rx="8" fill="#FBF1E2" stroke="#B5690C" stroke-width="1.6"/>
<text x="282" y="176" font-family="Geist" font-size="14" font-weight="600" fill="#211D17" text-anchor="start">xolkit daemon</text>
<text x="282" y="194" font-family="Geist" font-size="11.5" font-weight="400" fill="#6E665A" text-anchor="start">runs in the background · exits when idle</text>
<rect x="282" y="206" width="164" height="64" rx="6" fill="#F4F0E8" stroke="#DDD6C9" stroke-width="1"/>
<text x="292" y="227" font-family="Geist" font-size="12.5" font-weight="600" fill="#211D17" text-anchor="start">Session registry</text>
<text x="292" y="244" font-family="Geist" font-size="11" font-weight="400" fill="#6E665A" text-anchor="start">knows which agent is which</text>
<text x="292" y="260" font-family="Geist" font-size="11" font-weight="400" fill="#6E665A" text-anchor="start">filters what each one sees</text>
<rect x="454" y="206" width="164" height="64" rx="6" fill="#F4F0E8" stroke="#DDD6C9" stroke-width="1"/>
