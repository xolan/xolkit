name: release

# Releases whenever the workspace version in Cargo.toml has no matching v<version> tag yet.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    # A manual run on another branch must not publish that branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: check
    if: needs.check.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux binaries need the glibc of the image they're built on, so these stay on the
          # oldest supported LTS (22.04): the .deb then installs on Debian 12 and Ubuntu 22.04.
          # When GitHub retires these images, build in an ubuntu:22.04 container to keep that floor.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v7
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # dpkg-dev's dpkg-shlibdeps fills in the .deb's library dependencies.
          sudo apt-get install -y dpkg-dev libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev
      - name: Check the Metal compiler
        if: runner.os == 'macOS'
        run: xcrun --sdk macosx metal --version
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: mise run package ${{ matrix.target }}
      - name: Build the Debian package
        if: runner.os == 'Linux'
        run: mise run deb ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          # Tarballs for Linux/macOS, .deb for Linux, zip for Windows, each with its .sha256.
          path: |
            dist/*.tar.gz*
            dist/*.deb*
            dist/*.zip*

  release:
    needs: [check, ci, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - name: Verify release checksums
        run: cd dist && sha256sum -c ./*.sha256
      - name: Write the Arch Linux PKGBUILD
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: scripts/pkgbuild.sh "$VERSION" dist
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes
